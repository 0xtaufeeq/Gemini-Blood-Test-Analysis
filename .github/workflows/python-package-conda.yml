# .github/workflows/ci.yml

# Name of the workflow displayed on GitHub Actions tab
name: Python Application CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [ main ]
  # Triggers the workflow on pull request events targeting the main branch
  pull_request:
    branches: [ main ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This job is named "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4 # Use the latest version of the checkout action

      # Step 2: Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5 # Use the latest version of the setup-python action
        with:
          python-version: '3.10' # Specify the Python version you are using

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Lint with flake8 (Optional but recommended)
      # Ensure flake8 is listed in your requirements.txt or install it here
      # pip install flake8
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is often wide.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Add other steps here if needed, like running tests with pytest:
      # - name: Test with pytest
      #   run: |
      #     pip install pytest
      #     pytest
